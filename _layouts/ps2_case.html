<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Coda">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>

  <style>
    :root {
      --bg-color: hsl(0 0% 32%);
      --content-color: hsl(217deg 60% 72%);
      --color: #FFF;
    }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg-color);
      display: flex;
      overflow: hidden;
      font-family: Arial, sans-serif;
      place-self: center;
    }

    .sidebar {
      width: 64px;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      box-sizing: border-box;
      flex-shrink: 0;
      z-index: 10;
      height: 100dvh;
    }

    .logo-top img,
    .logo-bottom img {
      width: 48px;
      height: auto;
      display: block;
    }

    .sidebar-logo {
      width: 32px;
    }

    .sidebar-logo img {
      width: 100%;
    }

    .content {
      font-family: "Coda";
      font-weight: bold;
      background: var(--content-color);
      color: var(--color);
      overflow-x: hidden;
      overflow-y: auto;
      width: 640px;
      flex: 1 1 auto;
      max-width: calc(100vw - 64px);
      box-sizing: border-box;
    }

    .banner {
      position: relative;
      width: 100%;
      height: 160px;
      overflow: hidden;
    }

    .divider {
      position: relative;
      width: 100%;
      height: 240px;
      overflow: hidden;
    }

    .banner img, .divider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner::after,.divider::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        var(--content-color) 100%
      );
    }

    .divider::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0) 0%,
        var(--content-color) 100%
      );
    }

    .content-inner {
      padding: 32px;
      margin-top: -32px;
      position: relative;
      z-index: 2;
    }

    .content p {
      font-size: 1em;
      margin-top: 0;
      margin-bottom: 32px;
    }

    .content-back {
      display: none;
    }

    @media (min-width: 769px) {
      .content-back {
        display: block;
      }
    }

    .icon-row {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      width: 100%;
      margin-bottom: 40px;
    }

    .icon-row img {
      width: auto;
      height: 128px;
      display: block;
    }

    a {
      color: white;
    }

    #faq-title {
      margin-top: 0;
    }

    .faq-item {
      margin-bottom: 1em;
    }

    .faq-question {
      cursor: pointer;
    }

    .faq-answer p {
      margin: 0;
      font-weight: 100;
    }
  </style>

  
  <script>
  document.addEventListener("DOMContentLoaded", () => {
      const currentParams = new URLSearchParams(window.location.search);

      const allowed = [
          "utm_source",
          "utm_medium",
          "utm_campaign",
          "utm_content",
          "utm_term"
      ];

      document.querySelectorAll("a.link-patreon").forEach(link => {
          const url = new URL(link.href);

          for (const key of allowed) {
              const value = currentParams.get(key);
              if (value) {
                  url.searchParams.set(key, value);
              }
          }

          link.href = url.toString();
      });
  });
  </script>
</head>

<body>
  <!-- TODO: left panel showing screenshots -->
  <!-- <div class="content content-back">
  </div> -->

  <div class="sidebar">

    <div class="logo-top">
      <img
        src="/assets/logos/julianblane-pal-logo.png"
        alt="Julian Blane Icon"
      />
    </div>

    <div class="sidebar-logo">
      <img
        src="/assets/logos/olsedba-title.png"
        alt="Olsedba Title"
      />
    </div>

    <div class="logo-bottom">
      <img
        src="/assets/logos/esrb.webp"
        alt="ESRB Logo"
      />
    </div>

  </div>

  <main class="content">
    {{ content }}
  </main>
</body>
</html>
