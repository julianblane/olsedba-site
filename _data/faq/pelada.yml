- question: "¿De qué trata el juego de la Pelada de la Cañada?"
  open: true
  answer: |
    Es un juego de terror en el que tenés que sobrevivir siendo acechado por la criatura de la leyenda urbana.

- question: "¿Dónde transcurre el juego?"
  open: true
  answer: |
    Siendo fiel a la leyenda de la Pelada de la Cañada, transcurre en el barrio Güemes de la ciudad de Córdoba, Argentina.

- question: "¿Lo puedo jugar AHORA?"
  answer: |
    Todavía estamos en fase de pruebas. Aún no está disponible la demo, pero cuando este lista, vas a poder jugarla GRATIS.

- question: "¿Quien es el desarrollador?"
  answer: |
    El desarrollo es una colaboracion entre @olsedba y [@stigilism](https://www.instagram.com/stigilism/).

- question: "¿Es el mismo juego que hizo Chars?"
  hidden: true
  answer: |
    No. No debe confundirse con el juego existente de la Pelada de la Cañada. No tiene NADA que ver.
