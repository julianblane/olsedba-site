<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Coda">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>olsedba</title>

  <style>
    :root {
      --bg-color: hsl(0 0% 32%);
      --content-color: hsl(217deg 60% 72%);
    }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg-color);
      display: flex;
      overflow: hidden;
      font-family: Arial, sans-serif;
      place-self: center;
    }

    .sidebar {
      width: 64px;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      box-sizing: border-box;
      flex-shrink: 0;
      z-index: 10;
      height: 100dvh;
    }

    .logo-top img,
    .logo-bottom img {
      width: 48px;
      height: auto;
      display: block;
    }

    .sidebar-logo {
      width: 32px;
    }

    .sidebar-logo img {
      width: 100%;
    }

    .content {
      font-family: "Coda";
      font-weight: bold;
      background: var(--content-color);
      color: #FFF;
      overflow-y: auto;
      width: 100%;
      max-width: 768px;
      box-sizing: border-box;
    }

    .banner {
      position: relative;
      width: 100%;
      height: 160px;
      overflow: hidden;
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        var(--content-color) 100%
      );
    }

    .content-inner {
      padding: 32px;
      margin-top: -32px;
      position: relative;
      z-index: 2;
    }

    .content p {
      max-width: 700px;
      font-size: 1em;
      line-height: 1.7;
      margin-top: 0;
      margin-bottom: 32px;
    }

    .content-back {
      display: none;
    }

    @media (min-width: 769px) {
      .content-back {
        display: block;
      }
    }

    .icon-row {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      width: 100%;
      max-width: 700px;
      margin-bottom: 40px;
    }

    .icon-row img {
      width: auto;
      height: 128px;
      display: block;
    }

    a {
      color: white;
    }
  </style>
</head>

<body>
  <!-- TODO: left panel showing screenshots -->
  <!-- <div class="content content-back">

  </div> -->

  <div class="sidebar">

    <div class="logo-top">
      <img
        src="/assets/logos/julianblane-pal-logo.png"
        alt="Julian Blane Icon"
      />
    </div>

    <div class="sidebar-logo">
      <img
        src="/assets/logos/olsedba-title.png"
        alt="Olsedba Title"
      />
    </div>

    <div class="logo-bottom">
      <img
        src="/assets/logos/esrb.webp"
        alt="ESRB Logo"
      />
    </div>

  </div>

  <main class="content">

    <div class="banner">
      <img
        src="/assets/img/header.jpg"
        alt="Banner Image"
      />
    </div>

    <div class="content-inner">

      <p>
        ¡VOS! ¿Querés ser TESTER del primer juego retro de Córdoba Capital?<br>
        Pronto voy a abrir testing para mis seguidores.
      </p>

      <p>
        Encontrame en las redes como @olsedba
      </p>

      <div class="icon-row">
        <a href="https://instagram.com/olsedba" target="_blank">
          <img
            src="/assets/logos/instagram-olsedba-logo.png"
            alt="Instagram"
          />
        </a>

        <a href="https://tiktok.com/@olsedba" target="_blank">
          <img
            src="/assets/logos/tiktok-olsedba-logo.png"
            alt="Tiktok"
          />
        </a>
      </div>

      <p>
        ¿No tenes ganas de esperar?
        Suscribite a mi <a href="https://www.patreon.com/julianblane" target="_blank">Patreon y conseguí acceso anticipado</a>.
      </p>

      <div class="icon-row">
        <a href="https://www.patreon.com/julianblane" target="_blank">
          <img
            src="/assets/logos/patreon-banner.png"
            alt="Icon 1"
          />
        </a>
      </div>

    </div>

  </main>
</body>
</html>
